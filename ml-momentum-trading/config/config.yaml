# ML Momentum Trading System Configuration

# Trading Universe
universe:
  exchange: "NSE"
  symbols:
    - "INFY"
    - "TCS"
    - "RELIANCE"
    - "HDFCBANK"
    - "ICICIBANK"
    - "WIPRO"
    - "SBIN"
    - "AXISBANK"
    - "KOTAKBANK"
    - "BHARTIARTL"
    - "ITC"
    - "LT"
    - "HINDUNILVR"
    - "MARUTI"
    - "TATASTEEL"
    - "SUNPHARMA"
    - "ONGC"
    - "NTPC"
    - "POWERGRID"
    - "ASIANPAINT"

# Data Configuration
data:
  interval: "15minute"  # 5minute, 15minute, 30minute, day
  history_days: 365
  cache_enabled: true
  cache_dir: "data/cache"

# Feature Engineering
features:
  return_periods: [1, 3, 5, 10, 20]
  ma_windows: [5, 10, 20, 50]
  volatility_windows: [5, 10, 20]
  atr_windows: [14, 20]
  rsi_periods: [14, 20]
  breakout_windows: [10, 20, 50]
  volume_windows: [5, 10, 20]

# Model Training
training:
  model_type: "lightgbm"
  target_horizon: 1  # bars ahead
  target_threshold: 0.0  # return threshold for positive class

  # Walk-forward CV
  train_period_days: 180
  test_period_days: 30
  embargo_days: 5
  min_train_samples: 1000

  # LightGBM parameters
  model_params:
    objective: "binary"
    metric: "binary_logloss"
    boosting_type: "gbdt"
    num_leaves: 31
    learning_rate: 0.05
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 5
    verbose: -1
    seed: 42

  num_boost_round: 1000
  early_stopping_rounds: 50

  # Calibration
  calibration_method: "isotonic"  # isotonic or sigmoid

# Backtesting
backtest:
  initial_capital: 100000
  max_position_size: 1.0
  confidence_threshold: 0.6

  # Transaction costs (India equities)
  transaction_costs:
    brokerage_pct: 0.0003
    stt_pct: 0.00025
    exchange_charges_pct: 0.0000325
    gst_pct: 0.18
    sebi_charges_pct: 0.0000001
    stamp_duty_pct: 0.00015
    slippage_bps: 5.0
    volatility_multiplier: 2.0

# Live Trading
live_trading:
  mode: "SHADOW"  # SHADOW (no real orders) or LIVE
  product: "MIS"  # MIS (intraday) or CNC (delivery)

  # Signal generation
  signal_confidence_threshold: 0.6

  # Order execution
  order_type: "MARKET"  # MARKET, LIMIT
  rate_limit_delay: 0.15  # seconds between orders
  max_retries: 3

# Risk Management
risk:
  max_position_size: 100000
  max_positions: 3
  max_loss_per_trade: 2000
  max_daily_loss: 5000
  max_drawdown_pct: 0.10
  stop_loss_pct: 0.02
  take_profit_pct: 0.03

# Monitoring
monitoring:
  alert_threshold_pnl: -5000
  alert_threshold_slippage_bps: 20
  drift_window: 100

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_dir: "logs"
  audit_enabled: true
